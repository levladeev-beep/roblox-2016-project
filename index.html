<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Adlinox - Create Account</title>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <style>
        .page { gap: 56px; color: #333; margin: 0; display: flex; padding: 44px 20px 70px; box-sizing: border-box; min-height: 100vh; align-items: center; justify-content: center; background-color: #f4f4f4; background-image: radial-gradient(#dcdcdc 1px, transparent 1px); background-size: 20px 20px; font-family: 'Trebuchet MS', sans-serif; }
        @media (max-width: 820px) { .page { gap: 24px; flex-direction: column; } }
        .card { width: 100%; padding: 28px 30px 30px; max-width: 360px; background: #FFFFFF; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border-top: 5px solid #E2242A; }
        .brandArt { width: clamp(260px, 32vw, 440px); height: auto; }
        @media (max-width: 820px) { .brandArt { order: -1; width: min(72vw, 300px); } }
        .heading { color: #E2242A; margin: 0 0 20px; font-size: 24px; text-align: center; font-weight: 800; text-transform: uppercase; }
        
        .discord-submit { display: flex; align-items: center; justify-content: center; background-color: #5865F2; color: #FFFFFF; width: 100%; height: 42px; font-weight: 700; border-radius: 8px; text-decoration: none; margin-bottom: 15px; cursor: pointer; transition: 0.2s; }
        .discord-submit:hover { background-color: #4752C4; }
        .discord-submit svg { width: 20px; height: 20px; margin-right: 8px; fill: currentColor; }
        
        .discord-profile { display: none; align-items: center; background-color: #2b2d31; color: #fff; width: 100%; padding: 10px 12px; border-radius: 8px; margin-bottom: 15px; box-sizing: border-box; border: 1px solid #444; }
        .discord-profile img { width: 44px; height: 44px; border-radius: 50%; margin-right: 12px; background-color: #5865F2; }
        .discord-info { display: flex; flex-direction: column; }
        .discord-name { font-weight: 700; font-size: 16px; color: #fff; line-height: 1.2; }
        .discord-id { font-size: 12px; color: #b5bac1; margin-top: 4px; }
        .discord-check { margin-left: auto; color: #23a55a; font-weight: bold; font-size: 20px; }

        .form-divider { display: flex; align-items: center; color: #999; font-size: 13px; margin-bottom: 15px; text-transform: uppercase; }
        .form-divider::before, .form-divider::after { content: ''; flex: 1; border-bottom: 1px solid #e2e2e2; margin: 0 10px; }

        .input { width: 100%; border: 1.5px solid #ccc; padding: 11px 13px; font-size: 15px; border-radius: 8px; margin-bottom: 10px; box-sizing: border-box; outline: none; }
        .input:focus { border-color: #E2242A; }
        .input:disabled { background: #f5f5f5; cursor: not-allowed; }
        .submit { width: 100%; height: 42px; background: #E2242A; color: #fff; border: none; border-radius: 8px; font-weight: 700; text-transform: uppercase; cursor: pointer; }
        .submit:disabled { background: #aaa; cursor: not-allowed; }
        .links { color: #666; display: flex; font-size: 12px; margin-top: 18px; justify-content: space-between; }
        .links a { color: #E2242A; text-decoration: none; font-weight: 600; }
        .copyrightFooter { color: #888; width: 100%; bottom: 0; padding: 5px 0; position: fixed; font-size: 10px; background: rgba(255,255,255,0.8); text-align: center; }
    </style>
</head>
<body>
    <div class="page">
        <div class="card">
            <h2 class="heading">Create Account</h2>
            
            <form id="registerForm">
                <a id="discordBtn" href="https://adlinox-server.onrender.com/login" class="discord-submit">
                    <svg viewBox="0 0 127.14 96.36"><path d="M107.7,8.07A105.15,105.15,0,0,0,77.26,0a77.19,77.19,0,0,0-3.3,6.83A96.67,96.67,0,0,0,53.22,6.83,77.19,77.19,0,0,0,49.88,0,105.15,105.15,0,0,0,19.44,8.07C3.66,31.58-1.86,54.65,1,77.53A105.73,105.73,0,0,0,32,96.36a74.37,74.37,0,0,0,6.72-11,68.55,68.55,0,0,1-10.64-5.12c.91-.67,1.81-1.37,2.65-2.1a75.22,75.22,0,0,0,92.74,0c.84,1,1.74,1.43,2.65,2.1a68.55,68.55,0,0,1-10.64,5.12,74.37,74.37,0,0,0,6.72,11,105.73,105.73,0,0,0,31.05-18.83C129.87,49.86,123.86,27,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53S36.18,40.36,42.45,40.36,53.92,46,53.7,53,48.72,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.24,60,73.24,53S78.41,40.36,84.69,40.36,96.16,46,95.94,53,91,65.69,84.69,65.69Z"/></svg>
                    <span>Verify with Discord</span>
                </a>

                <div id="discordProfile" class="discord-profile">
                    <img id="profileAvatar" src="https://cdn.discordapp.com/embed/avatars/0.png" alt="Avatar">
                    <div class="discord-info">
                        <span id="profileName" class="discord-name">Загрузка...</span>
                        <span id="profileId" class="discord-id">ID: ...</span>
                    </div>
                    <span class="discord-check">✔</span>
                </div>

                <div class="form-divider">then fill the form</div>

                <input class="input" id="username" placeholder="Username" disabled required />
                <input class="input" id="password" placeholder="Password" type="password" disabled required />
                <input class="input" id="confirm" placeholder="Confirm Password" type="password" disabled required />
                <button class="submit" id="submitBtn" type="submit" disabled>Create Account</button>
            </form>
            <div class="links">
                <span>Already have an account? <a href="#">Log in</a></span>
                <a href="#">Forgot password?</a>
            </div>
        </div>
        <img class="brandArt" src="https://i.postimg.cc/mZCM5CRw/1792267230266.png" alt="Adlinox" />
        <div class="copyrightFooter">© 2026 Adlinox. All rights reserved.</div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            
            if (params.get('success') === 'true') {
                // Прячем кнопку, показываем профиль
                document.getElementById('discordBtn').style.display = 'none';
                document.getElementById('discordProfile').style.display = 'flex';
                
                // Берем данные ПРЯМО ИЗ ССЫЛКИ
                const name = params.get('name') || 'Discord User';
                const id = params.get('id') || 'Unknown';
                const avatar = params.get('avatar') || 'https://cdn.discordapp.com/embed/avatars/0.png';
                
                document.getElementById('profileName').innerText = name;
                document.getElementById('profileId').innerText = 'ID: ' + id;
                document.getElementById('profileAvatar').src = avatar;

                // Разблокируем форму
                document.getElementById('username').disabled = false;
                document.getElementById('password').disabled = false;
                document.getElementById('confirm').disabled = false;
                document.getElementById('submitBtn').disabled = false;
                
                window.history.replaceState({}, document.title, window.location.pathname);
            }
        });

        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const conf = document.getElementById('confirm').value;

            if (pass !== conf) { alert("Пароли не совпадают!"); return; }

            fetch('https://adlinox-server.onrender.com/save_login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: user, password: pass }),
                credentials: 'include'
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    window.location.href = 'home.html'; 
                }
            })
            .catch(err => alert("Сервер просыпается..."));
        });
    </script>
</body>
</html>
