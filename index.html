<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Adlinox - Create Account</title>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        .page {
            gap: 56px;
            color: #333;
            margin: 0;
            display: flex;
            padding: 44px 20px 70px;
            position: relative;
            box-sizing: border-box;
            min-height: 100vh;
            align-items: center;
            font-family: 'Trebuchet MS', 'HCo Gotham SSm', Arial, sans-serif;
            justify-content: center;
            background-color: #f4f4f4;
            background-image: radial-gradient(#dcdcdc 1px, transparent 1px);
            background-size: 20px 20px;
        }
        @media (max-width: 820px) {
            .page { gap: 24px; flex-direction: column; }
        }
        .card {
            width: 100%;
            padding: 28px 30px 30px;
            z-index: 2;
            position: relative;
            max-width: 360px;
            background: #FFFFFF;
            box-sizing: border-box;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border-top: 5px solid #E2242A;
        }
        @media (max-width: 420px) {
            .card { padding: 24px 22px 26px; }
        }
        
        .brandArt {
            width: clamp(260px, 32vw, 440px);
            height: auto;
            display: block;
            z-index: 2;
            position: relative;
            user-select: none;
            background-color: transparent; 
            border-radius: 12px;
        }
        @media (max-width: 820px) {
            .brandArt { order: -1; width: min(72vw, 300px); }
        }

        .heading {
            color: #E2242A;
            margin: 0 0 20px;
            font-size: 24px;
            text-align: center;
            font-weight: 800;
            letter-spacing: -0.02em;
            text-transform: uppercase;
        }
        .input {
            color: #333;
            width: 100%;
            border: 1.5px solid #ccc;
            outline: none;
            padding: 11px 13px;
            font-size: 15px;
            background: #fff;
            box-sizing: border-box;
            transition: border-color .13s ease;
            font-family: inherit;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .input::placeholder { color: #999; }
        .input:focus { border-color: #E2242A; }
        
        .submit {
            color: #FFFFFF;
            width: 100%;
            border: none;
            cursor: pointer;
            height: 42px;
            font-size: 15px;
            background: #E2242A;
            margin-top: 6px;
            transition: background .13s ease;
            font-family: inherit;
            font-weight: 700;
            border-radius: 8px;
            text-transform: uppercase;
        }
        .submit:hover { background: #c01c22; }
        
        .links {
            gap: 8px;
            color: #666;
            display: flex;
            flex-wrap: nowrap;
            font-size: 12px;
            margin-top: 18px;
            align-items: center;
            white-space: nowrap;
            justify-content: space-between;
        }
        .links button {
            font: inherit;
            color: #E2242A;
            border: none;
            cursor: pointer;
            padding: 0;
            background: none;
            font-weight: 600;
        }
        .links button:hover { text-decoration: underline; }
        .links a {
            color: #E2242A;
            font-weight: 600;
            text-decoration: none;
        }
        .links a:hover { text-decoration: underline !important; }
        
        .copyrightFooter {
            color: #888;
            width: 100%;
            bottom: 0;
            padding: 5px 0;
            z-index: 50;
            position: fixed;
            font-size: 10px;
            background: rgba(255,255,255,0.8);
            text-align: center;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div style="min-height:100vh">
        <div class="page">
            <div class="card">
                <h2 class="heading">Create Account</h2>
                
                <!-- ВОТ ТУТ ИЗМЕНЕНИЕ: onsubmit перекидывает на home.html -->
                <form onsubmit="event.preventDefault(); window.location.href='home.html';">
                    <input class="input" placeholder="Username" type="text" required />
                    <input class="input" placeholder="Password" type="password" required />
                    <input class="input" placeholder="Confirm Password" type="password" required />
                    <button class="submit" type="submit">Create Account</button>
                </form>
                
                <div class="links">
                    <span>Already have an account? <button type="button">Log in</button></span>
                    <a href="#">Forgot password?</a>
                </div>
            </div>
            
            <!-- ADLINOX LOGO -->
            <img class="brandArt" src="https://i.postimg.cc/mZCM5CRw/1792267230266.png" alt="Adlinox" />
            
            <div class="copyrightFooter">© 2026 Adlinox. All rights reserved.</div>
        </div>
    </div>
</body>
</html>
