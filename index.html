<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Adlinox - Create Account</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:ital,wght@0,200;0,300;0,400;0,600;0,700;0,900;1,200;1,300;1,400;1,600;1,700;1,900&display=swap" rel="stylesheet" />
    <style>
        .page {
            gap: 56px;
            color: #333;
            margin: 0;
            display: flex;
            padding: 44px 20px 70px;
            position: relative;
            box-sizing: border-box;
            min-height: 100vh;
            align-items: center;
            font-family: 'Trebuchet MS', 'HCo Gotham SSm', Arial, sans-serif;
            justify-content: center;
            background-color: #f4f4f4;
            background-image: radial-gradient(#dcdcdc 1px, transparent 1px);
            background-size: 20px 20px;
        }
        @media (max-width: 820px) {
            .page { gap: 24px; flex-direction: column; }
        }
        .card {
            width: 100%;
            padding: 28px 30px 30px;
            z-index: 2;
            position: relative;
            max-width: 360px;
            background: #FFFFFF;
            box-sizing: border-box;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border-top: 5px solid #E2242A;
        }
        @media (max-width: 420px) {
            .card { padding: 24px 22px 26px; }
        }
        
        .brandArt {
            width: clamp(260px, 32vw, 440px);
            height: auto;
            display: block;
            z-index: 2;
            position: relative;
            user-select: none;
            background-color: transparent; 
            border-radius: 12px;
        }
        @media (max-width: 820px) {
            .brandArt { order: -1; width: min(72vw, 300px); }
        }

        .heading {
            color: #E2242A;
            margin: 0 0 20px;
            font-size: 24px;
            text-align: center;
            font-weight: 800;
            letter-spacing: -0.02em;
            text-transform: uppercase;
        }
        
        /* Стили интеграции Discord */
        .discord-submit {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #5865F2;
            color: #FFFFFF;
            width: 100%;
            border: none;
            cursor: pointer;
            height: 42px;
            font-size: 15px;
            transition: background .13s ease;
            font-family: inherit;
            font-weight: 700;
            border-radius: 8px;
            text-decoration: none;
            box-sizing: border-box;
            margin-bottom: 15px;
        }
        .discord-submit:hover {
            background-color: #4752C4;
        }
        .discord-submit.verified {
            background-color: #248046;
            pointer-events: none;
        }
        .discord-submit svg {
            width: 20px;
            height: 20px;
            margin-right: 8px;
            fill: currentColor;
        }
        .form-divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: #999;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .form-divider::before, .form-divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e2e2e2;
        }
        .form-divider:not(:empty)::before { margin-right: .7em; }
        .form-divider:not(:empty)::after { margin-left: .7em; }

        .input {
            color: #333;
            width: 100%;
            border: 1.5px solid #ccc;
            outline: none;
            padding: 11px 13px;
            font-size: 15px;
            background: #fff;
            box-sizing: border-box;
            transition: all .13s ease;
            font-family: inherit;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .input::placeholder { color: #999; }
        .input:focus { border-color: #E2242A; }
        
        .input:disabled, .submit:disabled {
            background: #f5f5f5;
            color: #aaa;
            border-color: #e0e0e0;
            cursor: not-allowed;
        }

        .submit {
            color: #FFFFFF;
            width: 100%;
            border: none;
            cursor: pointer;
            height: 42px;
            font-size: 15px;
            background: #E2242A;
            margin-top: 6px;
            transition: background .13s ease;
            font-family: inherit;
            font-weight: 700;
            border-radius: 8px;
            text-transform: uppercase;
        }
        .submit:hover:not(:disabled) { background: #c01c22; }
        
        .links {
            gap: 8px;
            color: #666;
            display: flex;
            flex-wrap: nowrap;
            font-size: 12px;
            margin-top: 18px;
            align-items: center;
            white-space: nowrap;
            justify-content: space-between;
        }
        .links button {
            font: inherit;
            color: #E2242A;
            border: none;
            cursor: pointer;
            padding: 0;
            background: none;
            font-weight: 600;
        }
        .links button:hover { text-decoration: underline; }
        .links a {
            color: #E2242A;
            font-weight: 600;
            text-decoration: none;
        }
        .links a:hover { text-decoration: underline !important; }
        
        .copyrightFooter {
            color: #888;
            width: 100%;
            bottom: 0;
            padding: 5px 0;
            z-index: 50;
            position: fixed;
            font-size: 10px;
            background: rgba(255,255,255,0.8);
            text-align: center;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div style="min-height:100vh">
        <div class="page">
            <div class="card">
                <h2 class="heading">Create Account</h2>
                
                <form id="registerForm">
                    <!-- Ссылка теперь ведет на твой Python сервер в облаке Render -->
                    <a id="discordBtn" href="https://adlinox-server.onrender.com/login" class="discord-submit">
                        <svg viewBox="0 0 127.14 96.36" xmlns="http://www.w3.org/2000/svg">
                            <path d="M107.7,8.07A105.15,105.15,0,0,0,77.26,0a77.19,77.19,0,0,0-3.3,6.83A96.67,96.67,0,0,0,53.22,6.83,77.19,77.19,0,0,0,49.88,0,105.15,105.15,0,0,0,19.44,8.07C3.66,31.58-1.86,54.65,1,77.53A105.73,105.73,0,0,0,32,96.36a74.37,74.37,0,0,0,6.72-11,68.55,68.55,0,0,1-10.64-5.12c.91-.67,1.81-1.37,2.65-2.1a75.22,75.22,0,0,0,92.74,0c.84,1,1.74,1.43,2.65,2.1a68.55,68.55,0,0,1-10.64,5.12,74.37,74.37,0,0,0,6.72,11,105.73,105.73,0,0,0,31.05-18.83C129.87,49.86,123.86,27,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53S36.18,40.36,42.45,40.36,53.92,46,53.7,53,48.72,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.24,60,73.24,53S78.41,40.36,84.69,40.36,96.16,46,95.94,53,91,65.69,84.69,65.69Z"/>
                        </svg>
                        <span id="discordText">Verify with Discord</span>
                    </a>

                    <div class="form-divider">then fill the form</div>

                    <!-- Поля формы -->
                    <input class="input" placeholder="Username" type="text" id="username" disabled required />
                    <input class="input" placeholder="Password" type="password" id="password" disabled required />
                    <input class="input" placeholder="Confirm Password" type="password" id="confirmPassword" disabled required />
                    <button class="submit" type="submit" id="submitBtn" disabled>Create Account</button>
                </form>
                <div class="links">
                    <span>Already have an account? <button type="button">Log in</button></span>
                    <a href="#">Forgot password?</a>
                </div>
            </div>
            
            <!-- ЛОГОТИП -->
            <img class="brandArt" src="https://i.postimg.cc/mZCM5CRw/1792267230266.png" alt="Adlinox" />
            
            <div class="copyrightFooter">© 2026 Adlinox. All rights reserved.</div>
        </div>
    </div>

    <script>
        // 1. Проверка возврата с сервера (после Discord)
        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            
            if (params.get('success') === 'true') {
                const discordBtn = document.getElementById('discordBtn');
                const discordText = document.getElementById('discordText');
                
                discordText.innerText = "Discord Verified ✔";
                discordBtn.classList.add('verified');
                discordBtn.removeAttribute('href'); 
                
                document.getElementById('username').disabled = false;
                document.getElementById('password').disabled = false;
                document.getElementById('confirmPassword').disabled = false;
                document.getElementById('submitBtn').disabled = false;
                
                window.history.replaceState({}, document.title, window.location.pathname);
            }
        });

        // 2. Отправка формы на сервер Render
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault(); 
            
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const confirm = document.getElementById('confirmPassword').value;

            if (pass !== confirm) {
                alert("Пароли не совпадают!");
                return;
            }

            fetch('https://adlinox-server.onrender.com/save_login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: user, password: pass }),
                credentials: 'include' 
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert("✅ Аккаунт успешно привязан к Discord!");
                    window.location.href = 'home.html'; 
                } else {
                    alert("Ошибка: " + (data.error || "Неизвестная ошибка"));
                }
            })
            .catch(err => {
                alert("Сервер просыпается... Подождите 30 секунд и попробуйте снова.");
            });
        });
    </script>
</body>
</html>
